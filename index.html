<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ENGINEERING BAY // עמדת הנדסה</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#E8E2D4;
    color:#45402F;
    font-family:'Share Tech Mono','Courier New',monospace;
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
  }
  /* scanlines */
  #scan {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:repeating-linear-gradient(0deg, rgba(69,64,47,0.05) 0px, rgba(69,64,47,0.05) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:50;
  }
  .wrap { max-width:480px; margin:0 auto; padding:14px 14px 40px; }

  header { border-bottom:2px solid #45402F; padding-bottom:8px; margin-bottom:14px; }
  .h-top { display:flex; justify-content:space-between; align-items:baseline; }
  .h-title { font-size:18px; letter-spacing:2px; }
  .h-sub { font-size:11px; opacity:0.65; letter-spacing:1px; margin-top:3px; }
  .diamond { color:#4E8B7E; }

  .label { font-size:11px; letter-spacing:2px; opacity:0.6; margin:14px 0 6px; }

  /* slots */
  #slots { display:flex; gap:8px; }
  .slot {
    flex:1; height:70px; border:2px dashed rgba(69,64,47,0.4);
    background:rgba(69,64,47,0.04);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:9px; text-align:center; padding:2px; cursor:pointer; min-width:0;
  }
  .slot.filled { border:2px solid #45402F; background:#DAD3C2; }
  .slot .s-icon { font-size:16px; margin-bottom:3px; }
  .slot .s-empty { opacity:0.35; font-size:18px; }

  /* assemble button */
  #btnAssemble {
    width:100%; margin-top:12px; padding:14px;
    background:#45402F; color:#E8E2D4;
    border:none; font-family:inherit; font-size:15px; letter-spacing:3px;
    cursor:pointer;
  }
  #btnAssemble:disabled { opacity:0.3; }
  #btnAssemble:active { background:#4E8B7E; }

  #msg { min-height:20px; font-size:12px; text-align:center; margin-top:8px; letter-spacing:1px; }
  #msg.err { color:#B0553B; }
  #msg.ok { color:#4E8B7E; }
  .shake { animation:shake 0.3s linear; }
  @keyframes shake { 0%{transform:translateX(0)} 25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)} 100%{transform:translateX(0)} }

  /* inventory */
  #inv { display:flex; flex-wrap:wrap; gap:8px; }
  .res {
    width:calc(33.33% - 6px); border:2px solid #45402F; background:#DAD3C2;
    padding:8px 4px; text-align:center; cursor:pointer; position:relative;
  }
  .res:active { background:#4E8B7E; color:#E8E2D4; }
  .res .r-icon { font-size:22px; }
  .res .r-name { font-size:10px; margin-top:4px; line-height:1.3; }
  .res .r-count {
    position:absolute; top:-8px; left:-6px;
    background:#45402F; color:#E8E2D4; font-size:11px;
    min-width:20px; padding:2px 4px;
  }
  .res.rare { border-color:#A98634; }
  .res.rare .r-count { background:#A98634; }
  .res.up { border-color:#4E8B7E; background:rgba(78,139,126,0.15); }
  .res.up .r-count { background:#4E8B7E; }
  .res.zero { opacity:0.3; pointer-events:none; }

  /* recipes */
  #btnRecipes {
    width:100%; margin-top:14px; padding:10px;
    background:transparent; color:#45402F; border:2px solid #45402F;
    font-family:inherit; font-size:12px; letter-spacing:2px; cursor:pointer;
  }
  #recipes { display:none; border:2px solid #45402F; border-top:none; padding:10px; font-size:12px; background:rgba(69,64,47,0.04); }
  #recipes .rc { padding:6px 0; border-bottom:1px dashed rgba(69,64,47,0.3); line-height:1.5; }
  #recipes .rc:last-child { border-bottom:none; }
  .rc-out { color:#4E8B7E; }

  /* crafted list */
  #crafted { font-size:12px; }
  #crafted .cr { border-right:3px solid #4E8B7E; padding:5px 8px; margin-bottom:6px; background:rgba(78,139,126,0.1); }
  #crafted .cr-none { opacity:0.4; }

  #btnReset { display:block; margin:24px auto 0; background:none; border:none; color:#45402F; opacity:0.4; font-family:inherit; font-size:11px; letter-spacing:1px; cursor:pointer; text-decoration:underline; }

  /* ===== scanner ===== */
  #btnScan {
    width:100%; margin-top:12px; padding:12px;
    background:#4E8B7E; color:#E8E2D4; border:none;
    font-family:inherit; font-size:14px; letter-spacing:2px; cursor:pointer;
  }
  #btnScan:active { background:#45402F; }
  #vidWrap { position:relative; margin-top:16px; border:2px solid #45402F; background:#1a1812; overflow:hidden; }
  #vid { width:100%; display:block; }
  #vidFrame {
    position:absolute; top:50%; left:50%; width:58%; height:58%;
    -webkit-transform:translate(-50%,-50%); transform:translate(-50%,-50%);
    border:2px solid #4E8B7E; pointer-events:none;
  }
  #scanMsg { font-size:13px; text-align:center; margin-top:12px; min-height:18px; letter-spacing:1px; }
  #scanMsg.ok { color:#4E8B7E; }
  #scanMsg.err { color:#B0553B; }
  #manualRow { display:flex; gap:8px; margin-top:16px; }
  #manualCode { flex:1; padding:10px; border:2px solid #45402F; background:#DAD3C2; font-family:inherit; font-size:13px; color:#45402F; min-width:0; }
  #btnManual { padding:10px 16px; background:#45402F; color:#E8E2D4; border:none; font-family:inherit; font-size:13px; cursor:pointer; }
  #btnCloseScan { width:100%; margin-top:18px; padding:12px; background:transparent; border:2px solid #45402F; color:#45402F; font-family:inherit; font-size:13px; letter-spacing:2px; cursor:pointer; }

  /* ===== minigame overlay ===== */
  .overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:#E8E2D4; z-index:100; display:none;
    padding:20px 16px;
  }
  .overlay .wrap2 { max-width:480px; margin:0 auto; }
  #mgTitle { font-size:15px; letter-spacing:2px; border-bottom:2px solid #45402F; padding-bottom:8px; }
  #mgStage { font-size:12px; margin-top:14px; opacity:0.7; letter-spacing:1px; }
  #mgComp { font-size:16px; margin-top:4px; }

  #barWrap { margin-top:20px; }
  /* socket + part */
  #socket {
    position:relative; width:160px; height:160px; margin:0 auto;
    border:2px dashed rgba(69,64,47,0.45); background:rgba(69,64,47,0.04);
  }
  #socketNotch {
    position:absolute; top:-2px; left:50%; margin-left:-9px;
    width:18px; height:8px; background:#4E8B7E;
  }
  #part {
    position:absolute; top:14px; left:14px; right:14px; bottom:14px;
    border:2px solid #45402F; background:#DAD3C2;
    display:flex; align-items:center; justify-content:center;
    -webkit-transition:-webkit-transform 0.18s; transition:transform 0.18s;
    cursor:pointer;
  }
  #part .p-icon { font-size:44px; }
  #partNotch {
    position:absolute; top:-2px; left:50%; margin-left:-9px;
    width:18px; height:8px; background:#B0553B;
  }
  #socket.aligned #partNotch { background:#4E8B7E; }
  #socket.aligned #part { border-color:#4E8B7E; }
  #socket.done #part { background:rgba(78,139,126,0.35); border-color:#4E8B7E; }

  /* torque gauge */
  #torqueWrap { margin-top:20px; direction:ltr; }
  #torqueBar {
    position:relative; height:34px; border:2px solid #45402F; background:#DAD3C2; overflow:hidden;
  }
  #torqueZone { position:absolute; top:0; bottom:0; background:rgba(78,139,126,0.45); border-left:2px solid #4E8B7E; border-right:2px solid #4E8B7E; }
  #torqueFill { position:absolute; top:0; bottom:0; left:0; width:0%; background:rgba(69,64,47,0.55); }
  #torqueBar.hit #torqueZone { background:#4E8B7E; }
  #torqueBar.miss #torqueFill { background:#B0553B; }

  #mgBtns { display:flex; gap:10px; margin-top:20px; }
  #btnRotate, #btnFasten {
    flex:1; padding:16px 6px; border:none;
    font-family:inherit; font-size:15px; letter-spacing:2px; cursor:pointer;
  }
  #btnRotate { background:transparent; border:2px solid #45402F; color:#45402F; }
  #btnRotate:active { background:#DAD3C2; }
  #btnFasten { background:#45402F; color:#E8E2D4; }
  #btnFasten:active { background:#4E8B7E; }
  #btnFasten:disabled { opacity:0.3; }
  #mgHint { font-size:11px; text-align:center; opacity:0.6; margin-top:12px; letter-spacing:1px; min-height:16px; }
  #mgMistakes { font-size:12px; text-align:center; margin-top:6px; color:#B0553B; letter-spacing:1px; min-height:16px; }
  #pips { margin-top:14px; text-align:center; letter-spacing:8px; font-size:16px; }
  .pip-done { color:#4E8B7E; }
  .pip-todo { opacity:0.3; }

  /* ===== result overlay ===== */
  #resTag { font-size:13px; letter-spacing:3px; margin-top:30px; text-align:center; }
  #resTag.ok { color:#4E8B7E; }
  #resTag.bad { color:#B0553B; }
  .glitch { animation:gl 0.8s steps(2) 3; }
  @keyframes gl { 0%{opacity:1; transform:translateX(0)} 30%{opacity:0.4; transform:translateX(3px)} 60%{opacity:1; transform:translateX(-3px)} 100%{opacity:1; transform:translateX(0)} }
  #itemCard {
    border:2px solid #45402F; background:#DAD3C2; margin-top:20px; padding:18px; text-align:center;
  }
  #itemCard .ic-icon { font-size:40px; }
  #itemCard .ic-name { font-size:18px; margin-top:8px; letter-spacing:1px; }
  #itemCard .ic-eff { font-size:12px; margin-top:8px; opacity:0.75; line-height:1.6; }
  #btnBack {
    width:100%; margin-top:24px; padding:14px;
    background:transparent; border:2px solid #45402F; color:#45402F;
    font-family:inherit; font-size:13px; letter-spacing:2px; cursor:pointer;
  }
  @media (prefers-reduced-motion: reduce) {
    .shake,.glitch { animation:none; }
  }
</style>
</head>
<body>
<div id="scan"></div>

<div class="wrap" id="mainScreen">
  <header>
    <div class="h-top">
      <div class="h-title"><span class="diamond">◇</span> ENGINEERING BAY</div>
      <div style="font-size:11px;opacity:0.6;">v1.0</div>
    </div>
    <div class="h-sub">עמדת הנדסה // הכנס רכיבים לחריצי ההרכבה</div>
  </header>

  <div class="label">◇ חריצי הרכבה</div>
  <div id="slots"></div>
  <button id="btnAssemble" disabled>⚙ הרכב</button>
  <div id="msg"></div>

  <div class="label">◇ מלאי רכיבים</div>
  <div id="inv"></div>
  <button id="btnScan">◈ סרוק רכיב שנמצא בשטח</button>

  <button id="btnRecipes">◇ סכמות ידועות</button>
  <div id="recipes"></div>

  <div class="label">◇ פריטים שהורכבו</div>
  <div id="crafted"><div class="cr-none">— אין עדיין —</div></div>

  <button id="btnReset">אתחול מלאי</button>
</div>

<!-- minigame -->
<div class="overlay" id="mgScreen">
  <div class="wrap2">
    <div id="mgTitle"><span class="diamond">◇</span> ASSEMBLY SEQUENCE</div>
    <div id="mgStage"></div>
    <div id="mgComp"></div>
    <div id="barWrap">
      <div id="socket">
        <div id="socketNotch"></div>
        <div id="part">
          <span class="p-icon" id="partIcon"></span>
          <div id="partNotch"></div>
        </div>
      </div>
    </div>
    <div id="torqueWrap">
      <div id="torqueBar">
        <div id="torqueZone"></div>
        <div id="torqueFill"></div>
      </div>
    </div>
    <div id="mgBtns">
      <button id="btnRotate">↻ סובב</button>
      <button id="btnFasten" disabled>◈ הברג (החזק)</button>
    </div>
    <div id="mgHint"></div>
    <div id="mgMistakes"></div>
    <div id="pips"></div>
  </div>
</div>

<!-- scanner -->
<div class="overlay" id="scanScreen">
  <div class="wrap2">
    <div style="font-size:15px;letter-spacing:2px;border-bottom:2px solid #45402F;padding-bottom:8px;"><span class="diamond">◇</span> COMPONENT SCANNER</div>
    <div id="vidWrap">
      <video id="vid" playsinline autoplay muted></video>
      <div id="vidFrame"></div>
    </div>
    <div id="scanMsg"></div>
    <div id="manualRow">
      <input id="manualCode" type="text" placeholder="קוד ידני (למשל HTB:wood:001)">
      <button id="btnManual">הוסף</button>
    </div>
    <button id="btnCloseScan">◇ סגור סורק</button>
  </div>
</div>

<!-- result -->
<div class="overlay" id="resScreen">
  <div class="wrap2">
    <div id="resTag"></div>
    <div id="itemCard">
      <div class="ic-icon" id="icIcon"></div>
      <div class="ic-name" id="icName"></div>
      <div class="ic-eff" id="icEff"></div>
    </div>
    <button id="btnBack">◇ חזרה לעמדה</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
(function(){
  'use strict';

  /* ---------- data ---------- */
  var RES = {
    wood:    { name:'ענפי עץ',       icon:'♣', rare:false },
    gear:    { name:'גלגל שיניים',   icon:'⚙', rare:false },
    cable:   { name:'כבל',           icon:'∿', rare:false },
    oil:     { name:'שמן',           icon:'●', rare:false },
    board:   { name:'לוח אלקטרוני',  icon:'▦', rare:false },
    fabric:  { name:'בד',            icon:'▤', rare:false },
    metal:   { name:'מטיל מתכת',     icon:'▬', rare:false },
    gold:    { name:'מטיל זהב',      icon:'◆', rare:true  },
    alum:    { name:'אלומיניום',     icon:'▭', rare:false },
    copper:  { name:'נחושת',         icon:'◎', rare:false },
    leather: { name:'פיסת עור',      icon:'◈', rare:false }
  };
  /* רכיבים משודרגים: 5× מאותו רכיב בסיסי ← החומר המעובד שלו */
  var UPGRADES = {
    wood:    'לוחות עץ',
    gear:    'תיבת הילוכים',
    cable:   'צמת כבלים',
    oil:     'גלון שמן',
    board:   'מעבד ראשי',
    fabric:  'גליל בד',
    metal:   'פלדה מחוסמת',
    gold:    'זהב מזוקק',
    alum:    'סגסוגת אלומיניום',
    copper:  'סליל נחושת',
    leather: 'עור מעובד'
  };
  (function(){
    var k;
    for (k in UPGRADES) {
      RES[k + '2'] = { name: UPGRADES[k], icon: RES[k].icon, rare: false, up: true };
    }
  })();
  var UPGRADE_COUNT = 5;

  /* מלאי פתיחה ריק — הכל נאסף בסריקת רכיבים בשטח.
     לבדיקות: אפשר להזין קוד ידני פשוט כמו wood או oil בסורק. */
  var START_INV = { wood:0, gear:0, cable:0, oil:0, board:0, fabric:0, metal:0, gold:0, alum:0, copper:0, leather:0 };

  var RECIPES = [
    /* --- ריפוי --- */
    { id:'heal1', need:{fabric:1, leather:1}, icon:'⊕', name:'ערכת ריפוי בסיסית',
      eff:'מרפא 1 נק"פ.' },
    { id:'heal2', need:{gear:1, oil:1, metal:1}, icon:'✚', name:'ערכת ריפוי מתקדמת',
      eff:'מרפא 3 נק"פ.' },
    { id:'revive', need:{fabric:2, oil:1, board:1, copper:1}, icon:'❋', name:'ערכת החייאה',
      eff:'מחייה דמות + 1 נק"פ.' },
    /* --- הגנה --- */
    { id:'armor', need:{metal:1, copper:2, gold:2}, icon:'⛨', name:'שיפור עמידות',
      eff:'תוספת 1 נק"פ קבוע לדמות (אפשרי עד 3 פעמים).' },
    { id:'camo', need:{fabric:2, wood:1, leather:1}, icon:'▨', name:'רשת הסוואה',
      eff:'אפשרות להיות בלתי נראה פעם אחת. אין אפשרות לתקוף, וברגע שיוצאים מהמצב אי אפשר לחזור אליו שוב.' },
    /* --- לחימה --- */
    { id:'carry', need:{wood:1, leather:1, alum:1}, icon:'⚔', name:'שדרוג יכולת נשיאה',
      eff:'אפשרות להחזיק גם חרב וגם רובה בו-זמנית למשך השעה הקרובה.' },
    { id:'emp', need:{board:1, copper:1, cable:1, oil:1}, icon:'✷', name:'פצצת EMP',
      eff:'ברגע הזריקה: נזק של 1 נק"פ לכל מי שברדיוס מטר. שימוש יחיד.' },
    { id:'shock', need:{board:1, cable:1, copper:1}, icon:'⌁', name:'יכולת חישמול',
      eff:'בנגיעה בשחקן וקריאת המילה "חישמול" — השחקן יאבד 2 נק"פ. שימוש יחיד.' },
    /* --- עלילה --- */
    { id:'hackaid', need:{board:1, cable:2, gold:2}, icon:'⬖', name:'קוד סיוע לפריצה לתיבות',
      eff:'קוד סיוע לפריצה לתיבות.' },
    /* --- מתכוני-על (דורשים רכיבים משודרגים ★) --- */
    { id:'blade_x', need:{metal2:1, gold2:1}, icon:'⚜', name:'להב מעולה',
      eff:'שדרוג קבוע לנשק אחד: +2 נזק. מאושר ומסומן ע"י GM.' },
    { id:'shield_x', need:{board2:1, copper2:1}, icon:'⛉', name:'מגן תגובתי',
      eff:'חוסם אוטומטית את הפגיעה הראשונה בכל קרב. קבוע, מאושר ע"י GM.' },
    { id:'core_x', need:{oil2:1, gear2:1}, icon:'♻', name:'ליבת שחזור',
      eff:'החייאה עצמית אוטומטית ברגע המוות, ללא צורך בדמות אחרת. שימוש יחיד.' },
    { id:'ghost_x', need:{fabric2:1, leather2:1}, icon:'▩', name:'מעטה רפאים',
      eff:'כמו רשת הסוואה, אך מותר לנוע בזמן ההיעלמות. שימוש יחיד.' },
    { id:'relic_x', need:{cable2:1, wood2:1, alum2:1}, icon:'⌬', name:'ליבת YoRHa עתיקה',
      eff:'פריט עלילה נדיר במיוחד. מסור ל-GM — פותח סצנה או סוד עלילתי.' }
  ];

  var MAX_SLOTS = 5;

  /* סכמות שמוצגות לכולם מההתחלה. כל השאר מוסתרות כ-??? עד שמגלים אותן בהרכבה מוצלחת */
  var DEFAULT_KNOWN = { heal1:1, carry:1 };

  /* ---------- state ---------- */
  var inv = {};
  var slots = [];        // array of resource keys
  var craftedCounts = {};
  var usedCodes = {};    // serials that were already scanned on this device
  var discovered = {};   // recipe ids the player has unlocked on this device
  var currentRecipe = null;

  function isKnown(id){ return !!(DEFAULT_KNOWN[id] || discovered[id]); }

  /* ---------- persistence (localStorage, safe fallback) ---------- */
  function saveState(){
    try {
      localStorage.setItem('htb_craft', JSON.stringify({
        inv: inv, crafted: craftedCounts, used: usedCodes, disc: discovered
      }));
    } catch(e){}
  }
  function loadState(){
    try {
      var raw = localStorage.getItem('htb_craft');
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.inv) {
        inv = d.inv;
        craftedCounts = d.crafted || {};
        usedCodes = d.used || {};
        discovered = d.disc || {};
      }
    } catch(e){}
  }

  /* ---------- audio (optional, safe) ---------- */
  var actx = null;
  function beep(freq, dur){
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = 0.05;
      o.connect(g); g.connect(actx.destination);
      o.start();
      setTimeout(function(){ try { o.stop(); } catch(e){} }, dur);
    } catch(e){}
  }

  /* ---------- helpers ---------- */
  function $(id){ return document.getElementById(id); }
  function countInSlots(key){
    var n = 0, i;
    for (i = 0; i < slots.length; i++) if (slots[i] === key) n++;
    return n;
  }
  function slotsMultiset(){
    var m = {}, i;
    for (i = 0; i < slots.length; i++) {
      m[slots[i]] = (m[slots[i]] || 0) + 1;
    }
    return m;
  }
  function matchRecipe(){
    var m = slotsMultiset(), i, k, r, ok, totNeed, totHave;
    totHave = slots.length;
    /* שדרוג רכיב: 5 זהים מרכיב בסיסי ← רכיב משודרג */
    if (totHave === UPGRADE_COUNT) {
      var allSame = true, first = slots[0];
      for (i = 1; i < slots.length; i++) if (slots[i] !== first) allSame = false;
      if (allSame && RES[first] && !RES[first].up && RES[first + '2']) {
        return {
          isUpgrade: true,
          outKey: first + '2',
          icon: RES[first].icon,
          name: RES[first + '2'].name,
          eff: 'החומר המעובד נוסף למלאי. משמש במתכוני-העל.'
        };
      }
    }
    for (i = 0; i < RECIPES.length; i++) {
      r = RECIPES[i]; ok = true; totNeed = 0;
      for (k in r.need) {
        totNeed += r.need[k];
        if ((m[k] || 0) !== r.need[k]) { ok = false; }
      }
      if (ok && totNeed === totHave) return r;
    }
    return null;
  }

  /* ---------- render ---------- */
  function renderSlots(){
    var el = $('slots'), html = '', i, key;
    for (i = 0; i < MAX_SLOTS; i++) {
      key = slots[i];
      if (key) {
        html += '<div class="slot filled" data-i="' + i + '">' +
                '<div class="s-icon">' + RES[key].icon + '</div>' +
                RES[key].name + '</div>';
      } else {
        html += '<div class="slot" data-i="' + i + '"><div class="s-empty">+</div></div>';
      }
    }
    el.innerHTML = html;
    var nodes = el.getElementsByClassName('slot');
    for (i = 0; i < nodes.length; i++) {
      nodes[i].onclick = onSlotTap;
    }
    $('btnAssemble').disabled = slots.length < 2;
  }

  function renderInv(){
    var el = $('inv'), html = '', k, avail;
    for (k in RES) {
      /* רכיבים משודרגים מוצגים רק אם יש כאלה במלאי */
      if (RES[k].up && (inv[k] || 0) <= 0) continue;
      avail = (inv[k] || 0) - countInSlots(k);
      html += '<div class="res' + (RES[k].rare ? ' rare' : '') + (RES[k].up ? ' up' : '') +
              (avail <= 0 ? ' zero' : '') +
              '" data-k="' + k + '">' +
              '<div class="r-count">×' + avail + '</div>' +
              '<div class="r-icon">' + RES[k].icon + '</div>' +
              '<div class="r-name">' + RES[k].name + '</div></div>';
    }
    el.innerHTML = html;
    var nodes = el.getElementsByClassName('res'), i;
    for (i = 0; i < nodes.length; i++) {
      nodes[i].onclick = onResTap;
    }
  }

  function renderRecipes(){
    var el = $('recipes'), html = '', i, r, k, parts, hidden = 0;
    /* 1 — שדרוג רכיב (ידוע תמיד) */
    html += '<div class="rc"><b>שדרוג רכיב:</b> 5× מאותו רכיב ← <span class="rc-out">החומר המעובד שלו</span> (למשל 5× שמן ← גלון שמן, 5× ענפי עץ ← לוחות עץ)</div>';
    for (i = 0; i < RECIPES.length; i++) {
      r = RECIPES[i];
      if (!isKnown(r.id)) { hidden++; continue; }
      parts = [];
      for (k in r.need) parts.push(r.need[k] + '× ' + RES[k].name);
      html += '<div class="rc">' + parts.join(' + ') +
              ' ← <span class="rc-out">' + r.icon + ' ' + r.name + '</span></div>';
    }
    if (hidden > 0) {
      html += '<div class="rc" style="opacity:0.55;">??? — סכמות נוספות ממתינות לגילוי. נסו שילובים חדשים של רכיבים.</div>';
    }
    el.innerHTML = html;
  }

  function renderCrafted(){
    var el = $('crafted'), html = '', k, any = false, i, r;
    for (i = 0; i < RECIPES.length; i++) {
      r = RECIPES[i];
      k = craftedCounts[r.id] || 0;
      if (k > 0) {
        any = true;
        html += '<div class="cr">' + r.icon + ' ' + r.name + ' ×' + k + '</div>';
      }
    }
    if (!any) html = '<div class="cr-none">— אין עדיין —</div>';
    el.innerHTML = html;
  }

  function setMsg(text, cls){
    var el = $('msg');
    el.className = cls || '';
    el.innerHTML = text;
  }

  /* ---------- interactions ---------- */
  function onResTap(){
    var k = this.getAttribute('data-k');
    if (slots.length >= MAX_SLOTS) { setMsg('כל החריצים מלאים', 'err'); return; }
    var avail = (inv[k] || 0) - countInSlots(k);
    if (avail <= 0) return;
    slots.push(k);
    beep(660, 60);
    setMsg('');
    renderSlots(); renderInv();
  }

  function onSlotTap(){
    var i = parseInt(this.getAttribute('data-i'), 10);
    if (i < slots.length) {
      slots.splice(i, 1);
      beep(440, 50);
      setMsg('');
      renderSlots(); renderInv();
    }
  }

  $('btnRecipes').onclick = function(){
    var el = $('recipes');
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  };

  $('btnReset').onclick = function(){
    var k;
    inv = {};
    for (k in START_INV) inv[k] = START_INV[k];
    slots = [];
    craftedCounts = {};
    usedCodes = {};
    discovered = {};
    saveState();
    setMsg('המלאי אותחל', 'ok');
    renderSlots(); renderInv(); renderCrafted(); renderRecipes();
  };

  $('btnAssemble').onclick = function(){
    var r = matchRecipe();
    if (!r) {
      beep(180, 200);
      setMsg('◈ אין סכמה תואמת — בדוק את הרכיבים', 'err');
      $('slots').className = 'shake';
      setTimeout(function(){ $('slots').className = ''; }, 350);
      return;
    }
    currentRecipe = r;
    startMinigame(r);
  };

  /* ---------- minigame: assembly (rotate + fasten) ---------- */
  var MAX_MISTAKES = 3;
  var mg = {
    stage:0, total:0, rot:0, aligned:false,
    filling:false, fill:0, last:0, raf:null,
    zoneL:0, zoneW:0, mistakes:0, busy:false
  };

  function startMinigame(recipe){
    mg.total = slots.length;
    mg.stage = 0;
    mg.mistakes = 0;
    $('mainScreen').style.display = 'none';
    $('mgScreen').style.display = 'block';
    renderMistakes();
    nextStage();
  }

  function nextStage(){
    var key = slots[mg.stage];
    $('mgStage').innerHTML = 'רכיב ' + (mg.stage + 1) + ' / ' + mg.total;
    $('mgComp').innerHTML = RES[key].icon + ' ' + RES[key].name;
    $('partIcon').innerHTML = RES[key].icon;
    renderPips();

    /* התחלה מסובבת: 1-3 רבעי סיבוב */
    mg.rot = 90 * (1 + Math.floor(Math.random() * 3));
    mg.aligned = false;
    mg.busy = false;
    applyRot();

    /* אזור ההידוק: רחב ונדיב, מצטמצם מעט מרכיב לרכיב */
    mg.zoneW = Math.max(34 - mg.stage * 2, 26);
    mg.zoneL = 48 + Math.random() * (94 - mg.zoneW - 48);
    mg.fill = 0; mg.filling = false;
    $('torqueZone').style.left = mg.zoneL + '%';
    $('torqueZone').style.width = mg.zoneW + '%';
    $('torqueFill').style.width = '0%';
    $('torqueBar').className = '';
    $('socket').className = '';
    $('btnFasten').disabled = true;
    $('mgHint').innerHTML = 'סובב את הרכיב עד שהסימון מתיישר עם השקע';
  }

  function applyRot(){
    var p = $('part');
    var t = 'rotate(' + mg.rot + 'deg)';
    p.style.webkitTransform = t;
    p.style.transform = t;
    if (mg.rot % 360 === 0) {
      mg.aligned = true;
      $('socket').className = 'aligned';
      $('btnFasten').disabled = false;
      $('mgHint').innerHTML = 'מיושר! החזק את כפתור ההברגה ושחרר בתוך האזור הירוק';
      beep(660, 70);
    }
  }

  function renderPips(){
    var html = '', i;
    for (i = 0; i < mg.total; i++) {
      html += '<span class="' + (i < mg.stage ? 'pip-done' : 'pip-todo') + '">◆</span>';
    }
    $('pips').innerHTML = html;
  }

  function renderMistakes(){
    var html = '', i;
    if (mg.mistakes > 0) {
      html = 'שגיאות: ';
      for (i = 0; i < MAX_MISTAKES; i++) html += (i < mg.mistakes) ? '✕' : '·';
    }
    $('mgMistakes').innerHTML = html;
  }

  $('btnRotate').onclick = function(){
    if (mg.busy || mg.aligned) return;
    mg.rot += 90;
    beep(440, 40);
    applyRot();
  };
  $('part').onclick = function(){
    if (mg.busy || mg.aligned) return;
    mg.rot += 90;
    beep(440, 40);
    applyRot();
  };

  /* torque hold */
  function fillLoop(){
    if (!mg.filling) return;
    var now = (new Date()).getTime();
    if (!mg.last) mg.last = now;
    var dt = (now - mg.last) / 1000;
    mg.last = now;
    mg.fill += 55 * dt; /* אחוזים לשנייה */
    if (mg.fill >= 100) {
      mg.fill = 100;
      mg.filling = false;
      $('torqueFill').style.width = '100%';
      torqueResult(false, 'הידוק יתר! ההברגה נשחקה');
      return;
    }
    $('torqueFill').style.width = mg.fill + '%';
    if (window.requestAnimationFrame) {
      mg.raf = window.requestAnimationFrame(fillLoop);
    } else {
      mg.raf = setTimeout(fillLoop, 16);
    }
  }

  function fastenStart(ev){
    if (ev && ev.preventDefault) ev.preventDefault();
    if (!mg.aligned || mg.busy || mg.filling) return;
    mg.fill = 0; mg.last = 0; mg.filling = true;
    $('torqueBar').className = '';
    fillLoop();
  }

  function fastenEnd(ev){
    if (ev && ev.preventDefault) ev.preventDefault();
    if (!mg.filling) return;
    mg.filling = false;
    var inZone = (mg.fill >= mg.zoneL && mg.fill <= mg.zoneL + mg.zoneW);
    if (inZone) {
      torqueResult(true, '');
    } else {
      torqueResult(false, mg.fill < mg.zoneL ? 'הידוק חלש מדי' : 'הידוק חזק מדי');
    }
  }

  function torqueResult(ok, failMsg){
    mg.busy = true;
    if (ok) {
      beep(880, 120);
      $('torqueBar').className = 'hit';
      $('socket').className = 'done';
      $('mgHint').innerHTML = '◇ הרכיב הותקן';
      mg.stage++;
      if (mg.stage >= mg.total) {
        setTimeout(craftSuccess, 600);
      } else {
        setTimeout(nextStage, 650);
      }
    } else {
      beep(180, 250);
      $('torqueBar').className = 'miss';
      mg.mistakes++;
      renderMistakes();
      if (mg.mistakes >= MAX_MISTAKES) {
        $('mgHint').innerHTML = '◈ ' + failMsg;
        setTimeout(craftFail, 700);
      } else {
        $('mgHint').innerHTML = '◈ ' + failMsg + ' — נסה שוב';
        setTimeout(function(){
          mg.busy = false;
          mg.fill = 0;
          $('torqueFill').style.width = '0%';
          $('torqueBar').className = '';
        }, 650);
      }
    }
  }

  (function(){
    var b = $('btnFasten');
    b.ontouchstart = fastenStart;
    b.ontouchend = fastenEnd;
    b.ontouchcancel = fastenEnd;
    b.onmousedown = fastenStart;
    b.onmouseup = fastenEnd;
    b.onmouseleave = function(){ if (mg.filling) fastenEnd(); };
  })();

  /* ---------- results ---------- */
  function craftSuccess(){
    var r = currentRecipe, i;
    /* consume resources */
    for (i = 0; i < slots.length; i++) {
      inv[slots[i]] = (inv[slots[i]] || 0) - 1;
    }
    slots = [];

    $('mgScreen').style.display = 'none';
    $('resScreen').style.display = 'block';
    var tag = $('resTag');
    tag.className = 'ok glitch';
    $('icIcon').innerHTML = r.icon;
    $('icName').innerHTML = r.name;

    if (r.isUpgrade) {
      /* שדרוג: הרכיב המשודרג נכנס למלאי */
      inv[r.outKey] = (inv[r.outKey] || 0) + 1;
      tag.innerHTML = '◇ COMPONENT UPGRADED ◇';
      $('icEff').innerHTML = r.eff;
    } else {
      craftedCounts[r.id] = (craftedCounts[r.id] || 0) + 1;
      tag.innerHTML = '◇ UNIT ASSEMBLED ◇';
      var extra = '<br><br>הצג מסך זה למגירת הפריטים בעמדה.';
      /* גילוי סכמה: מתכון שהורכב לראשונה נחשף ומצטרף לרשימת הסכמות במכשיר */
      if (!isKnown(r.id)) {
        discovered[r.id] = 1;
        renderRecipes();
        extra += '<br><span style="color:#4E8B7E;">◇ סכמה חדשה התגלתה! היא נוספה לרשימת הסכמות שלך.</span>';
      }
      $('icEff').innerHTML = r.eff + extra;
    }
    saveState();
    beep(660, 90); setTimeout(function(){ beep(880, 90); }, 120); setTimeout(function(){ beep(1100, 150); }, 260);
  }

  function craftFail(){
    /* lose one random slotted resource, return the rest */
    var idx = Math.floor(Math.random() * slots.length);
    var lostKey = slots[idx];
    inv[lostKey] = (inv[lostKey] || 0) - 1;
    slots = [];
    saveState();

    $('mgScreen').style.display = 'none';
    $('resScreen').style.display = 'block';
    var tag = $('resTag');
    tag.className = 'bad glitch';
    tag.innerHTML = '◈ CALIBRATION FAILED ◈';
    $('icIcon').innerHTML = '✕';
    $('icName').innerHTML = 'ההרכבה נכשלה';
    $('icEff').innerHTML = 'הרכיב <b>' + RES[lostKey].name + '</b> נהרס בתהליך.<br>שאר הרכיבים הוחזרו למלאי.';
  }

  $('btnBack').onclick = function(){
    $('resScreen').style.display = 'none';
    $('mainScreen').style.display = 'block';
    currentRecipe = null;
    setMsg('');
    renderSlots(); renderInv(); renderCrafted();
  };

  /* ---------- component scanner ---------- */
  var scanStream = null, scanning = false, scanCanvas = null, scanCtx = null, lastHit = 0;

  function setScanMsg(text, cls){
    var el = $('scanMsg');
    el.className = cls || '';
    el.innerHTML = text;
  }

  /* קלט חוקי:
     - gear                      (מפתח פשוט, לבדיקות)
     - HTB:gear:001              (מפתח + מספר סידורי, כל קלף נסרק פעם אחת)
     - כל URL שמכיל ?add=HTB:gear:001 (כדי שגם מצלמת המכשיר תעבוד) */
  function parseCode(str){
    var s = ('' + str).replace(/\s/g, '');
    var i = s.indexOf('add=');
    if (i >= 0) {
      s = s.substring(i + 4);
      var amp = s.indexOf('&');
      if (amp >= 0) s = s.substring(0, amp);
    }
    try { s = decodeURIComponent(s); } catch(e){}
    var parts = s.split(':');
    if (parts.length >= 2 && parts[0].toLowerCase() === 'htb') {
      return { key: parts[1].toLowerCase(), code: s.toLowerCase() };
    }
    return { key: s.toLowerCase(), code: null };
  }

  function addResource(key, code){
    if (!RES[key]) return { ok:false, msg:'קוד לא מזוהה' };
    if (code && usedCodes[code]) return { ok:false, msg:'הרכיב הזה כבר נסרק' };
    if (code) usedCodes[code] = 1;
    inv[key] = (inv[key] || 0) + 1;
    saveState();
    renderInv();
    return { ok:true, msg:'+1 ' + RES[key].name };
  }

  function handleCode(raw){
    var p = parseCode(raw);
    var r = addResource(p.key, p.code);
    if (r.ok) { beep(880, 100); setScanMsg('◇ ' + r.msg, 'ok'); }
    else { beep(180, 250); setScanMsg('◈ ' + r.msg, 'err'); }
    return r;
  }

  function openScanner(){
    $('mainScreen').style.display = 'none';
    $('scanScreen').style.display = 'block';
    setScanMsg('', '');
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia || typeof jsQR === 'undefined') {
      $('vidWrap').style.display = 'none';
      setScanMsg('אין גישה למצלמה במכשיר זה — הזן קוד ידני', 'err');
      return;
    }
    $('vidWrap').style.display = 'block';
    md.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream){
      scanStream = stream;
      var v = $('vid');
      try { v.srcObject = stream; }
      catch(e) {
        var U = window.URL || window.webkitURL;
        if (U && U.createObjectURL) v.src = U.createObjectURL(stream);
      }
      v.setAttribute('playsinline', 'true');
      try { v.play(); } catch(e2){}
      scanning = true;
      lastHit = 0;
      scanLoop();
    })['catch'](function(){
      $('vidWrap').style.display = 'none';
      setScanMsg('הגישה למצלמה נדחתה — הזן קוד ידני', 'err');
    });
  }

  function scanLoop(){
    if (!scanning) return;
    var v = $('vid');
    if (v.readyState >= 2 && v.videoWidth && v.videoHeight) {
      if (!scanCanvas) {
        scanCanvas = document.createElement('canvas');
        scanCtx = scanCanvas.getContext('2d');
      }
      var w = v.videoWidth, h = v.videoHeight;
      scanCanvas.width = w; scanCanvas.height = h;
      scanCtx.drawImage(v, 0, 0, w, h);
      var result = null;
      try {
        var img = scanCtx.getImageData(0, 0, w, h);
        result = jsQR(img.data, w, h);
      } catch(e){}
      var now = (new Date()).getTime();
      if (result && result.data && now - lastHit > 1500) {
        lastHit = now;
        handleCode(result.data);
      }
    }
    setTimeout(scanLoop, 250);
  }

  function closeScanner(){
    scanning = false;
    if (scanStream) {
      try {
        var tr = scanStream.getTracks ? scanStream.getTracks() : [];
        for (var ti = 0; ti < tr.length; ti++) tr[ti].stop();
      } catch(e){}
      scanStream = null;
    }
    $('scanScreen').style.display = 'none';
    $('mainScreen').style.display = 'block';
    renderInv();
  }

  $('btnScan').onclick = openScanner;
  $('btnCloseScan').onclick = closeScanner;
  $('btnManual').onclick = function(){
    var val = $('manualCode').value;
    if (!val) return;
    handleCode(val);
    $('manualCode').value = '';
  };

  /* ---------- init ---------- */
  var k;
  inv = {};
  for (k in START_INV) inv[k] = START_INV[k];
  loadState();
  renderSlots(); renderInv(); renderRecipes(); renderCrafted();

  /* תמיכה בסריקה עם מצלמת המכשיר: QR שמוביל ל-craft.html?add=HTB:gear:001 */
  if (window.location.search && window.location.search.indexOf('add=') >= 0) {
    var up = parseCode(window.location.search);
    var ur = addResource(up.key, up.code);
    setMsg(ur.ok ? '◇ ' + ur.msg : '◈ ' + ur.msg, ur.ok ? 'ok' : 'err');
  }
})();
</script>
</body>
</html>
